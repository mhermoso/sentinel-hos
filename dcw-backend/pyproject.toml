[project]
name = "dcw-backend"
version = "1.0.0"
description = "Driver Compliance Watch — 49 CFR Part 395 HOS Compliance Platform"
authors = [{ name = "Driver Compliance Watch LLC" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.28",
    "redis>=5.0.3",
    "arq>=0.25.0",
    "httpx>=0.27.0",
    "mygeotab>=0.9.0",
    "twilio>=9.0.0",
    "weasyprint>=61.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
