name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcw_user
          POSTGRES_PASSWORD: dcw_secure_password
          POSTGRES_DB: dcw_compliance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcw_user -d dcw_compliance_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov bandit

      - name: Run Ruff Checks
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run Mypy Type Analysis
        run: mypy app/

      - name: Run Bandit Security Scan
        run: bandit -r app/ -q

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://dcw_user:dcw_secure_password@localhost:5432/dcw_compliance_db"
          REDIS_URL: "redis://localhost:6379/0"
        run: pytest tests/ --cov=app --cov-report=xml
